name: Final submission integrity

on:
  push:
  pull_request:

jobs:
  verify-submission:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify official PDF, Excel and RAR hashes
        run: python scripts/verify_submission_integrity.py
